name: Feature request
description: An idea for something new or better.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
      description: Tell us about the task, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Any workaround you use now.
